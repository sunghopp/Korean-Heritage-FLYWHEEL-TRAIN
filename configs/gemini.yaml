project_id: "385248657749"
bucket: "malmoi-jeju-dataset-2026"
text_prefix: "dataset/extracted/Text"
flywheel_prefix: "flywheel/gemini"
# Existing Agent Platform translation endpoint. It is the first evaluation baseline.
baseline_endpoint: "projects/385248657749/locations/us-central1/endpoints/7571681821318971392"
# The existing translation LoRA/version is the first continuous-SFT source.
# After an approved run, releases/current.json supplies the next source version.
initial_pre_tuned_model: "projects/385248657749/locations/us-central1/models/880260762860257280@1"
old_golden_manifest: "gs://malmoi-jeju-dataset-2026/flywheel/gemini/eval/old-golden-v1.jsonl"
replay_manifest: "gs://malmoi-jeju-dataset-2026/flywheel/gemini/replay-v1.jsonl"
 # 임시 테스트 임계값: configs/stt.yaml의 min_samples와 동일하게 유지한다.
min_samples: 10
validation_ratio: 0.2
# 10개 테스트에서는 20%인 2개를 Validation으로 고정한다.
min_validation_samples: 2
replay_ratio: 1.0
seed: 42
# Automated Gemini output is not valid ground truth for BLEU gating.
require_human_review: true
promotion:
  # BLEU score is on a 0-100 scale.
  old_bleu_regression_max: 1.0
  new_bleu_improvement_min: 1.0
