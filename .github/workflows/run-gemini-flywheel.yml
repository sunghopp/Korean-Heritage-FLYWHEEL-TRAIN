name: Run Gemini Flywheel

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "GCS snapshot ID created by Create Gemini Flywheel Snapshot"
        required: true
        type: string
      mode:
        description: "submit: 튜닝 제출, wait: 최대 4시간 완료 대기+평가, finalize: 상태 1회 확인·평가"
        required: true
        default: submit
        type: choice
        options: [submit, wait, finalize]

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FLYWHEEL_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Execute immutable Gemini snapshot
        run: |
          gcloud run jobs execute jeju-gemini-flywheel \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region=asia-southeast1 \
            --args="${{ inputs.snapshot_id }},--mode,${{ inputs.mode }},--poll-seconds,300,--max-wait-seconds,14400,--config,configs/gemini.yaml" \
            --wait
      - name: Apply approved translation endpoint to API
        if: inputs.mode == 'finalize' || inputs.mode == 'wait'
        run: |
          EVALUATION="gs://malmoi-jeju-dataset-2026/flywheel/gemini/evaluations/${{ inputs.snapshot_id }}.json"
          if gcloud storage ls "$EVALUATION" >/dev/null 2>&1; then
            APPROVED=$(gcloud storage cat "$EVALUATION" | jq -r '.approved')
            if [ "$APPROVED" = "true" ]; then
              CANDIDATE_ENDPOINT=$(gcloud storage cat "$EVALUATION" | jq -r '.candidate_endpoint')
              gcloud run services update jeju-backend \
                --project="${{ secrets.GCP_PROJECT_ID }}" \
                --region=asia-southeast1 \
                --update-env-vars="GEMINI_TUNED_ENDPOINT=$CANDIDATE_ENDPOINT"
            else
              echo "BLEU gate rejected this candidate; the API endpoint is unchanged."
            fi
          else
            echo "Tuning is still running after the maximum wait; the API endpoint is unchanged."
          fi
