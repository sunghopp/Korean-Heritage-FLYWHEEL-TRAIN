name: Create Gemini Flywheel Snapshot

on:
  workflow_dispatch:
  # 비용 통제를 위해 정기 실행은 비활성화한다. 필요 시 아래 주석을 해제한다.
  # schedule:
  #   - cron: "15 2 * * *" # 매일 11:15 KST

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FLYWHEEL_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create immutable snapshot when human-approved translations reach the threshold
        run: |
          pip install -r requirements-gemini.txt
          python -m flywheel.gemini_cli --config configs/gemini.yaml snapshot
