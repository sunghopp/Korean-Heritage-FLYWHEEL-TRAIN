name: Run STT Flywheel

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "GCS snapshot ID created by the snapshot job"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FLYWHEEL_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Execute immutable snapshot
        run: |
          gcloud run jobs execute jeju-stt-flywheel \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region=asia-southeast1 \
            --args="${{ inputs.snapshot_id }},--config,configs/stt.yaml,--promote" \
            --wait
          APPROVED=$(gcloud storage cat "gs://malmoi-jeju-dataset-2026/flywheel/stt/evaluations/${{ inputs.snapshot_id }}.json" | jq -r '.approved')
          if [ "$APPROVED" = "true" ]; then
            gcloud run services update jeju-backend \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --region=asia-southeast1 \
              --update-env-vars="STT_RELEASE_MANIFEST_PATH=gs://malmoi-jeju-dataset-2026/flywheel/stt/releases/current.json"
          fi
